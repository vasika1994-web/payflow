name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    name: Стиль, тесты, миграции
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: payments_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/payments_test
      ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установить зависимости
        run: pip install -r requirements-dev.txt

      - name: Проверить стиль
        run: ruff check .

      - name: Проверить форматирование
        run: ruff format --check .

      - name: Прогнать тесты
        run: pytest -v

      - name: Проверить, что миграции не разошлись с моделями
        run: alembic upgrade head && alembic check

  e2e:
    name: Сквозной сценарий на docker compose
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - name: Поднять compose
        run: docker compose --profile demo up --build -d --wait --wait-timeout 180

      - name: Платёж → webhook, платёж → retry → DLQ
        run: bash scripts/demo.sh

      - name: Логи при сбое
        if: failure()
        run: docker compose logs --no-color

      - name: Убрать
        if: always()
        run: docker compose --profile demo down -v
