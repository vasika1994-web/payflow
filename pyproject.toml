[project]
name = "payflow"
version = "1.0.0"
description = "Асинхронный процессинг платежей: API, outbox, RabbitMQ, consumer с webhook-уведомлениями"
requires-python = ">=3.12"
# зависимости - в requirements.txt / requirements-dev.txt

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Один цикл событий на весь прогон: пул asyncpg привязан к циклу, в котором создан.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:asyncpg.*",
    "ignore::DeprecationWarning:pytest_asyncio.*",
]
